<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <article class="blog-card" aria-labelledby="blog-card-title">
        <img
          class="blog-card__image"
          src="./assets/images/illustration-article.svg"
          alt="Article Illustration"
          height="200"
          width="279"
        />

        <section class="blog-card__content">
          <span class="blog-card__category">Learning</span>

          <p class="blog-card__date">
            Published <time datetime="2023-12-21">21 Dec 2023</time>
          </p>

          <h1 id="blog-card-title" class="blog-card__title">
            HTML &amp; CSS foundations
          </h1>

          <p class="card_content_description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </section>

        <footer class="blog-card__author">
          <img
            class="blog-card__avatar"
            src="./assets/images/image-avatar.webp"
            alt="User Avatar"
            width="32"
            height="32"
          />
          <span class="text-preset-3 blog-card__author-name">Greg Hooper</span>
        </footer>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">aldo</a>.
    </footer>
  </body>
</html>
