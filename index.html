<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <article class="card">
        <img
          class="card_image"
          src="./assets/images/illustration-article.svg"
          alt="Article Illustration"
        />
        <section class="card_content">
          <span class="card_content_category">Learning</span>
          <span class="card_content_date"
            >Published <time datetime="2023-12-21">21 Dec 2023</time></span
          >
          <h3 class="card_content_title">HTML & CSS foundations</h3>
          <p class="card_content_description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </section>
        <section class="card_author">
          <img
            class="card_author_picture"
            src="./assets/images/image-avatar.webp"
            alt="User Picture"
          />
          <span class="text-preset-3 card_author_name">Greg Hooper</span>
        </section>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
